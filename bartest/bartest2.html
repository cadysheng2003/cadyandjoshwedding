<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>bar test 2</title>
<meta name="theme-color" content="#d29592">
<style>
  html { background: #d29592; }
  body { margin: 0; min-height: 220lvh; font: 15px/1.45 -apple-system, system-ui, sans-serif; color: #fff; }
  .carpet { position: fixed; left: 0; width: 100%; top: 0; height: 100lvh; background: url(carpet.jpg) center / cover no-repeat; z-index: 0; }
  .box { position: fixed; z-index: 2; left: 16px; right: 16px; top: 50%; transform: translateY(-50%);
         background: rgba(0,0,0,.62); border-radius: 14px; padding: 14px 16px; text-shadow: none; }
  .box b { font-size: 22px; display: block; margin-bottom: 6px; }
  .probe { position: fixed; visibility: hidden; left: 0; top: 0; width: 1px; pointer-events: none; }
  #pt { height: env(safe-area-inset-top, 0px); } #pb { height: env(safe-area-inset-bottom, 0px); }
  #lvh { height: 100lvh; } #dvh { height: 100dvh; } #svh { height: 100svh; }
  .scrollhint { position: absolute; top: 105lvh; left: 0; right: 0; text-align: center; z-index: 1; font-size: 18px; text-shadow: 0 1px 4px #000; }
</style></head>
<body>
<div class="carpet"></div>
<div class="probe" id="pt"></div><div class="probe" id="pb"></div><div class="probe" id="lvh"></div><div class="probe" id="dvh"></div><div class="probe" id="svh"></div>
<div class="box"><b>Version 2</b><div>Carpet fills the whole screen + theme-color pink (#d29592).</div><pre id="out" style="margin:8px 0 0;white-space:pre-wrap;font:13px/1.35 ui-monospace,monospace"></pre></div>
<div class="scrollhint">scroll down, then back up &darr;</div>
<script>
function show(){
  var h = function (id) { return Math.round(document.getElementById(id).getBoundingClientRect().height); };
  document.getElementById('out').textContent =
    'innerHeight ' + innerHeight + '  screen ' + screen.height + '\n' +
    'lvh ' + h('lvh') + '  dvh ' + h('dvh') + '  svh ' + h('svh') + '\n' +
    'safe top ' + h('pt') + '  bottom ' + h('pb') + '\n' +
    'visualViewport ' + Math.round(visualViewport.height) + '  scrollY ' + Math.round(scrollY);
}
show(); addEventListener('scroll', show); addEventListener('resize', show);
</script></body></html>
